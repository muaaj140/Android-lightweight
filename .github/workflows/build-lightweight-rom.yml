name: Build Lightweight ROM

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Base ROM ZIP download URL (optional if local base exists)"
        required: false
        default: ""
      rom_name:
        description: "Output ROM name"
        required: true
        default: "LightROM-v1"
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  build-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip aria2
          mkdir -p build_work/rom build_work/out

      - name: Prepare Base ROM Structure
        env:
          ROM_URL: ${{ github.event.inputs.rom_url }}
        run: |
          cd build_work/rom
          if [ -n "$ROM_URL" ]; then
            echo "Downloading base ROM..."
            aria2c -x 8 -s 8 "$ROM_URL" -o base.zip
            unzip -q base.zip -d extracted
            rm -f base.zip
          else
            echo "Creating clean system structure..."
            mkdir -p extracted/system/app extracted/system/priv-app extracted/META-INF/com/google/android
            echo "ro.build.display.id=LightROM" > extracted/system/build.prop
          fi

      - name: Inject Prebuilt APKs
        run: |
          cd build_work/rom/extracted
          mkdir -p system/app
          shopt -s nullglob
          APK_COUNT=0

          for apk in ../../../prebuilt_apps/*.apk; do
            APP_NAME=$(basename "$apk" .apk)
            mkdir -p "system/app/$APP_NAME"
            cp "$apk" "system/app/$APP_NAME/$APP_NAME.apk"
            echo "Added APK: $APP_NAME.apk"
            APK_COUNT=$((APK_COUNT + 1))
          done

          echo "Total APKs injected: $APK_COUNT"

      - name: Apply Custom Design Files (if present)
        run: |
          if [ -d "custom_design" ]; then
            cp -r custom_design/* build_work/rom/extracted/
            echo "Custom design applied."
          fi

      - name: Package ROM ZIP
        env:
          ROM_NAME: ${{ github.event.inputs.rom_name }}
        run: |
          cd build_work/rom/extracted
          zip -r -q "../../out/${ROM_NAME}.zip" .
          ls -lh "../../out/${ROM_NAME}.zip"

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rom_name }}-package
          path: build_work/out/*.zip
          
